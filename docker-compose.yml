version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - .:/app
      - f1_telemetry_cache:/app/f1_cache
    depends_on:
      - redis

  worker:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - F1_USERNAME=${F1_USERNAME}
      - F1_PASSWORD=${F1_PASSWORD}
    volumes:
      - .:/app
      - f1_telemetry_cache:/app/f1_cache
    depends_on:
      - redis
    command: celery -A worker.celery_app worker --loglevel=info

volumes:
  f1_telemetry_cache: